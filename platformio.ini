; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = 
	rak4630

boards_dir = rakwireless/boards

[common]
build_flags = 
	-D LIB_DEBUG=0        ; 0 Disable LoRaWAN debug output
monitor_speed = 115200
lib_deps = 
	beegee-tokyo/SX126x-Arduino

[env:rak4630]
platform = nordicnrf52
board = rak4630 
framework = arduino
build_src_filter = ${env.build_src_filter}+<../rakwireless/variants/rak4630>
build_flags = 
	${common.build_flags}
	-I rakwireless/variants/rak4630
lib_deps = 
	${common.lib_deps}
  sparkfun/SparkFun u-blox GNSS Arduino Library
  wollewald/MPU9250_WE
  greiman/SdFat@^2.2.3
  paulstoffregen/Time
  jchristensen/Timezone
; often helps PlatformIO resolve nested includes cleanly
lib_ldf_mode = deep+
